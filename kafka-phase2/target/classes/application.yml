# All Kafka wiring lives here — no connection code in Java.
# This is the big win of Spring: configuration over boilerplate.

server:
  port: 8081            # 8080 is taken by the Kafka UI from Phase 0

spring:
  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all         # durable writes, same lesson as Phase 1

    consumer:
      group-id: phase2-group
      auto-offset-reset: earliest   # read from the start if this group is new
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Our application's own setting (read in TopicConfig)
app:
  topic: app-events
